[package]
name = "asimov"
version.workspace = true
edition.workspace = true

[[bin]]
name = "asimov"
path = "src/main.rs"

[features]
default = ["voice"]
voice = ["asimov-core/voice", "asimov-tui/voice"]

[dependencies]
asimov-core = { workspace = true }
asimov-api = { workspace = true }
asimov-acp = { workspace = true }
asimov-tools = { workspace = true }
asimov-query = { workspace = true }
asimov-tui = { workspace = true }
asimov-commands = { workspace = true }
asimov-mcp = { workspace = true }
asimov-bridge = { workspace = true }
asimov-plugins = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
crossterm = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
nix = { workspace = true }
base64 = "0.22"
sha2 = "0.10"
open = "5"
urlencoding = "2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[build-dependencies]
chrono = { workspace = true }
